<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glimmer 512k — Progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#232833; --fg:#d7dce4; --dim:#8a93a3;
          --ok:#3fb970; --warn:#e0a63c; --err:#e05c5c; --accent:#5aa2e8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  main { max-width:1180px; margin:0 auto; padding:20px; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:900px){ .grid2{grid-template-columns:1fr} }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
              color:var(--dim); margin:0 0 8px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  td,th { padding:3px 8px 3px 0; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:normal; }
  .bar { display:inline-block; height:8px; background:var(--line); border-radius:4px;
         width:120px; vertical-align:middle; margin-right:8px; overflow:hidden; }
  .bar>i { display:block; height:100%; background:var(--accent); }
  .ok{color:var(--ok)} .off{color:var(--dim)} .warn{color:var(--warn)} .err{color:var(--err)}
  .pill { padding:1px 7px; border-radius:9px; background:var(--line); font-size:11px; }
  .tail { white-space:pre-wrap; color:var(--dim); font-size:11px; max-height:120px;
          overflow:auto; border-top:1px solid var(--line); padding-top:6px; }
  .taskrow td { border-bottom:1px solid var(--line); }
  .score { color:var(--accent); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Muse Glimmer 30B — 512k Adaptation</h1>
  <div class="sub" id="ts">loading…</div>

  <div class="grid2">
    <div class="panel"><h2>Eval grids (rows / total)</h2><table id="grids"></table></div>
    <div class="panel"><h2>Pipeline</h2><table id="pipe"></table>
      <div style="margin-top:10px"><h2>Watchers</h2><div id="watchers"></div></div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px"><h2>Selected grid scores (task × ctx)</h2>
    <select id="gsel"></select>
    <table id="scores" style="margin-top:8px"></table>
  </div>

  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h2>Log tails</h2><div id="tails"></div></div>
    <div class="panel"><h2>Corpus / env</h2><div id="corpus"></div></div>
  </div>
</main>
<script>
let S = null;
const $ = (id) => document.getElementById(id);
const pct = (a,b) => b ? Math.round(100*a/b) : 0;

async function refresh() {
  try { S = await (await fetch("/api/status")).json(); } catch (e) {
    $("ts").textContent = "server unreachable: " + e; return;
  }
  $("ts").textContent = "updated " + new Date(S.ts).toLocaleString() +
    (S.docker.vllm_up ? " · vLLM up" : " · vLLM down");

  $("grids").innerHTML = S.grids.map(g => {
    const p = pct(g.rows, g.total);
    return `<tr><td>${g.name}</td>
      <td><span class="bar"><i style="width:${p}%"></i></span>${g.rows}/${g.total} (${p}%)</td>
      <td>${g.exists ? "" : "<span class='off'>not started</span>"}</td></tr>`;
  }).join("");

  $("pipe").innerHTML = Object.entries(S.markers).map(([m, v]) => {
    const done = v != null;
    return `<tr><td>${m}</td><td>${done ? `<span class="ok">done</span>` :
      `<span class="off">pending</span>`}</td>
      <td class="tail" style="max-height:2.4em;overflow:hidden">${done ? String(v).slice(0,80) : ""}</td></tr>`;
  }).join("");

  $("watchers").innerHTML = Object.entries(S.watchers).map(([w, on]) =>
    `<span class="pill ${on ? "ok" : "off"}" style="margin:2px">${w}</span>`).join("");

  const sel = $("gsel");
  const cur = sel.value;
  sel.innerHTML = S.grids.filter(g => g.rows > 0)
    .map(g => `<option value="${g.file}">${g.name}</option>`).join("");
  if (cur) sel.value = cur;

  $("tails").innerHTML = Object.entries(S.tails).map(([t, lines]) =>
    `<div style="margin-bottom:8px"><b style="color:var(--fg)">${t}</b>
     <div class="tail">${lines.join("\n").replace(/</g,"&lt;")}</div></div>`).join("");

  const c = S.corpus;
  $("corpus").innerHTML = c ? `<table>
    <tr><td>rows</td><td>${c.rows}</td><td>tokens</td><td>${(c.tokens/1e6).toFixed(1)}M</td></tr>
    <tr><td>@131072</td><td>${c.length_buckets?.["131072"]?.rows ?? "?"} rows /
        ${((c.length_buckets?.["131072"]?.tokens ?? 0)/1e6).toFixed(1)}M tok</td>
        <td>@262144</td><td>${c.length_buckets?.["262144"]?.rows ?? "?"} rows</td></tr>
    ${Object.entries(c.components).map(([k,v]) =>
      `<tr><td>${k}</td><td>${v.n}/${v.avail ?? "?"} (${v.actual})</td>
       <td>target</td><td>${v.target}</td></tr>`).join("")}
  </table>` : "no corpus manifest yet";

  sel.onchange = loadScores;
  if (sel.value) loadScores();
}

async function loadScores() {
  const f = $("gsel").value; if (!f) return;
  const rows = await (await fetch("/api/grid/" + f)).json();
  const byTask = {};
  rows.forEach(r => (byTask[r.task] = byTask[r.task] || {})[r.ctx] = r);
  const ctxs = [...new Set(rows.map(r => r.ctx))].sort((a,b)=>a-b);
  $("scores").innerHTML = `<tr><th>task</th>${ctxs.map(c=>`<th>${(c/1000)|0}k</th>`).join("")}</tr>` +
    Object.keys(byTask).sort().map(t =>
      `<tr class="taskrow"><td>${t}</td>` + ctxs.map(c => {
        const r = byTask[t][c];
        if (!r) return `<td class="off">—</td>`;
        const col = r.mean >= 0.98 ? "ok" : r.mean >= 0.5 ? "warn" : "err";
        return `<td class="${col}">${r.mean.toFixed(3)} <span class="off">(${r.n})</span></td>`;
      }).join("") + `</tr>`).join("");
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
